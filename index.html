<style>
  :root{
    --bg:#14142b; --panel:#1f1f3d; --ink:#f4f1e6; --dim:#a9a6c4;
    --yel:#ffd23f; --pink:#ff4f9a; --cyan:#3ed6ff; --grn:#7ee05b; --red:#ff5d5d;
    --line:#45457a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:600 15px/1.45 ui-monospace,"SFMono-Regular","Menlo","Consolas","Courier New",monospace;
       background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px);
       min-height:100vh;padding:16px 12px 48px}
  main{max-width:560px;margin:0 auto}
  canvas.px{image-rendering:pixelated;display:block;max-width:100%}
  .hdr{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
  .hdr .sub{color:var(--dim);font-size:12px;letter-spacing:.06em}
  .card{background:var(--panel);padding:14px;margin:14px 0;
        box-shadow:0 0 0 3px var(--line),0 0 0 6px var(--bg),0 0 0 9px var(--line)}
  .card.hot{box-shadow:0 0 0 3px var(--yel),0 0 0 6px var(--bg),0 0 0 9px var(--yel)}
  .card.pink{box-shadow:0 0 0 3px var(--pink),0 0 0 6px var(--bg),0 0 0 9px var(--pink)}
  h2{font-size:14px;letter-spacing:.12em;color:var(--yel);margin:0 0 10px;text-transform:uppercase}
  p{margin:.4em 0}
  .dim{color:var(--dim)} .yel{color:var(--yel)} .cyan{color:var(--cyan)} .grn{color:var(--grn)} .pink{color:var(--pink)}
  .big{font-size:22px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .stat{background:var(--bg);padding:8px 4px}
  .stat b{display:block;font-size:22px;color:var(--cyan)}
  .stat span{font-size:11px;color:var(--dim);letter-spacing:.08em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--dim);font-weight:600;text-align:left;font-size:11px;letter-spacing:.08em;padding:4px 4px;border-bottom:2px solid var(--line)}
  td{padding:7px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
  td.n{text-align:right;white-space:nowrap}
  th.n{text-align:right}
  .id{color:var(--yel);font-weight:800;white-space:nowrap}
  .tag{font-size:10px;padding:1px 5px;margin-left:4px;letter-spacing:.06em;white-space:nowrap}
  .tag.open{background:var(--grn);color:#0b2a00}
  .tag.done{background:var(--line);color:var(--ink)}
  .tag.new{background:var(--pink);color:#2a0012}
  .tag.goal{background:var(--yel);color:#2a2000}
  .loc{display:block;color:var(--dim);font-size:12px;font-weight:500}
  button,.btn{font:inherit;font-weight:800;letter-spacing:.1em;background:var(--yel);color:#1a1400;border:0;padding:12px 18px;
       cursor:pointer;box-shadow:0 4px 0 #b08a00;text-transform:uppercase;width:100%}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #b08a00}
  input{font:inherit;width:100%;padding:10px;background:var(--bg);color:var(--ink);border:3px solid var(--line);margin:6px 0 12px}
  ol,ul{padding-left:20px;margin:.3em 0} li{margin:.3em 0}
  details summary{cursor:pointer;color:var(--cyan)}
  .quote{border-left:4px solid var(--pink);padding-left:10px;font-style:italic}
  .code{font-size:28px;letter-spacing:.2em;color:var(--grn);text-align:center;background:var(--bg);padding:10px}
  .route{word-break:break-word;font-size:13px}
  .blink{animation:b 1s steps(2) infinite} @keyframes b{50%{opacity:0}}
  .center{text-align:center}
  .warn{color:var(--red)}
  footer{color:var(--dim);font-size:11px;text-align:center;margin-top:24px}
</style>
</head>

  st.exp.push(p.id); st.nodes[p.id]=p;
  for(const nb of p.nb) st.keys[nb.id]=nb.k;
  if(p.goal){
    const cost=st.g[p.id], scans=st.exp.length;
    st.finished={cost,scans,at:Date.now(),route:routeTo(st,p.id),code:await proofCode(p.gs,st.exp,cost,scans)};
  }
  return st;
}
// One scan, as the site handles it. Returns {view, st, ...}
async function handleScan(table,st,slug){
  const entry=await entryFor(table,slug);
  if(!entry) return {view:"unknown",st};
  const id=entry.id;
  if(st&&st.finished) return {view:"final",st,id};
  if(st&&st.g[id]!==undefined) return {view:"node",st,id,revisit:true};
  const k=st?keyFor(st,id):(id===META.startId?META.startKey:null);
  if(!st){ if(id===META.startId) return {view:"intro",st,id,entry}; return {view:"fog",st,id}; }
  if(!k) return {view:"fog",st,id};
  const p=await decrypt(entry,slug,k);
  st=await expand(st,p);
  return {view:st.finished?"final":"node",st,id,fresh:true};
}
if(typeof module!=="undefined") module.exports={handleScan,newState,openList,decrypt,entryFor,expand,proofCode,META};

/* --------------------------------- UI ---------------------------------- */
if(typeof document!=="undefined"){
  const TABLE=JSON.parse(document.getElementById("nodes").textContent);
  const $app=document.getElementById("app");
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let storageOK=true;
  function load(){try{return JSON.parse(localStorage.getItem(STORE)||"null");}catch(e){storageOK=false;return null;}}
  function save(st){try{localStorage.setItem(STORE,JSON.stringify(st));}catch(e){storageOK=false;}}

  function pixel(text,scale,color){
    const c=document.createElement("canvas"); const w=text.length*6-1, h=7;
    c.width=w*scale; c.height=h*scale; c.className="px"; const x=c.getContext("2d"); x.fillStyle=color;
    [...text.toUpperCase()].forEach((ch,i)=>{const g=FONT[ch]||FONT["?"];for(let r=0;r<7;r++)for(let q=0;q<5;q++)
      if(g[r*5+q]==="1")x.fillRect((i*6+q)*scale,r*scale,scale,scale);});
    return c.outerHTML.replace("<canvas",'<canvas data-t="'+esc(text)+'" data-s="'+scale+'" data-c="'+color+'"');
  }
  // canvases lose pixels via outerHTML; redraw after insertion
  function hydrate(){document.querySelectorAll("canvas[data-t]").forEach(c=>{
    const t=c.dataset.t,s=+c.dataset.s,x=c.getContext("2d");x.fillStyle=c.dataset.c;
    [...t.toUpperCase()].forEach((ch,i)=>{const g=FONT[ch]||FONT["?"];for(let r=0;r<7;r++)for(let q=0;q<5;q++)
      if(g[r*5+q]==="1")x.fillRect((i*6+q)*s,r*s,s,s);});});}

  const header=()=>`<div class="hdr">${pixel("A* QUEST",4,"#ffd23f")}<div class="sub">CSCI 313<br>J-TERM 2027</div></div>`;
  const flr=n=>`Floor ${n}`;
  const ad=()=>`<div class="card pink"><h2>The course</h2>
    <p><b>CSCI 313 · Artificial Intelligence with Applications in Games</b></p>
    <p class="dim">J-Term 2027 · Dr. Caley</p>
    <p class="quote">"I think this course was just about perfect. One of my favorite classes I have ever taken at PLU."</p>
    <p class="dim" style="text-align:right">a previous student</p></div>`;
  const rules=(open)=>`<details ${open?"open":""} class="card"><summary><b>HOW TO PLAY</b></summary>
    <ol>
      <li>Your quest begins at <span class="yel">START</span>: ${esc(META.startLoc)} (Floor 1). Goal: <span class="yel">GOAL</span>, Floor 2.</li>
      <li>Scanning a flier <b>expands</b> that node. It reveals the node's neighbors: where their fliers are posted, the edge cost <b>c</b> to reach them, and a heuristic <b>h</b>.</li>
      <li>You can only expand nodes in your <span class="grn">OPEN LIST</span>, meaning nodes you've revealed but haven't expanded. Every other flier is fog of war, and scanning it does nothing.</li>
      <li><b>g</b> is the cheapest known cost from START. <b>h</b> estimates the remaining cost to GOAL and <i>never overestimates</i>.</li>
      <li>The flier locations have nothing to do with the graph. Two fliers side by side may be far apart in the graph, so the floor plan won't help. Trust the numbers.</li>
      <li>The game ends when you expand GOAL. Your score is your <b>DISTANCE TRAVERSED</b>: the cost of the route you found from START to GOAL. <b>Lowest wins.</b> Ties go to fewer scans, then to whoever finished first.</li>
      <li>One run per person. Always scan with your phone's camera and use the same browser.</li>
    </ol>
    <p class="dim">Hint: this game is named after an algorithm for a reason.</p></details>`;

  function openTable(st,curId){
    const o=Object.values(openList(st)).sort((a,b)=>a.id<b.id?-1:1);
    if(!o.length) return `<p class="dim">Open list is empty.</p>`;
    return `<table><tr><th>NODE / WHERE</th><th class="n">g</th><th class="n">h</th></tr>${o.map(n=>
      `<tr><td><span class="id">${esc(n.id)}</span>${n.id===META.goalId?'<span class="tag goal">GOAL</span>':""}
        <span class="loc">${flr(n.fl)} · ${esc(n.loc)}</span></td><td class="n">${n.g}</td><td class="n">${n.h}</td></tr>`).join("")}</table>`;
  }

  function viewNode(st,id,fresh){
    const p=st.nodes[id];
    const nb=p.nb.map(n=>{
      const s=st.g[n.id]!==undefined?'<span class="tag done">EXPANDED</span>':'<span class="tag open">OPEN</span>';
      return `<tr><td><span class="id">${esc(n.id)}</span>${s}${n.id===META.goalId?'<span class="tag goal">GOAL</span>':""}
        <span class="loc">${flr(n.fl)} · ${esc(n.loc)}</span></td><td class="n">${n.c}</td><td class="n">${n.h}</td></tr>`;}).join("");
    return header()+`
      <div class="card hot"><h2>${fresh?"Node expanded":"Already expanded"}</h2>
        <div>${pixel("NODE "+id,5,"#3ed6ff")}</div>
        <p class="dim">${flr(p.fl)} · ${esc(p.loc)}</p>
        <div class="stats"><div class="stat"><b>${st.g[id]}</b><span>g HERE</span></div>
          <div class="stat"><b>${p.h}</b><span>h HERE</span></div>
          <div class="stat"><b>${st.exp.length}</b><span>SCANS</span></div></div>
        ${fresh?"":`<p class="dim">You already expanded this node. Rescanning it costs nothing and changes nothing.</p>`}
      </div>
      <div class="card"><h2>Neighbors revealed</h2>
        <table><tr><th>NODE / WHERE</th><th class="n">c</th><th class="n">h</th></tr>${nb}</table></div>
      <div class="card"><h2>Your open list</h2>${openTable(st,id)}
        <p class="dim">Go find one of these fliers and scan it to expand it. Which one? Your call.</p></div>
      <details class="card"><summary><b>EXPANDED SO FAR (${st.exp.length})</b></summary>
        <p class="route">${st.exp.map(x=>`<span class="id">${esc(x)}</span> g=${st.g[x]}`).join(" → ")}</p></details>`
      +rules(false);
  }

  function viewFinal(st){
    const f=st.finished, mins=Math.max(1,Math.round((f.at-st.startedAt)/60000));
    return header()+`
      <div class="card hot center"><div style="display:flex;justify-content:center">${pixel("GOAL!",8,"#7ee05b")}</div>
        <p class="big">${esc(st.name)}</p>
        <p class="dim">DISTANCE TRAVERSED</p>
        <div style="display:flex;justify-content:center">${pixel(String(f.cost),10,"#ffd23f")}</div>
        <div class="stats" style="margin-top:12px"><div class="stat"><b>${f.scans}</b><span>SCANS</span></div>
          <div class="stat"><b>${f.route.length-1}</b><span>EDGES</span></div>
          <div class="stat"><b>${mins}</b><span>MINUTES</span></div></div>
        <p style="margin-top:12px">Show this screen to <b>Dr. Caley</b> in <b>Room 247</b>. Lowest distance wins.</p>
        <p class="dim">VERIFICATION CODE</p><div class="code">${f.code}</div>
        <p class="dim">Finished ${new Date(f.at).toLocaleString()}</p></div>
      <div class="card"><h2>Your route</h2><p class="route">${f.route.map(x=>`<span class="id">${esc(x)}</span>`).join(" → ")}</p>
        <h2 style="margin-top:12px">Scan order</h2><p class="route dim">${st.exp.join("-")}</p></div>
      <div class="card"><h2>Was that optimal?</h2><p>A* with a heuristic that never overestimates (and here also never contradicts itself) always finds the shortest route, and expands as few nodes as any algorithm that has the same information. In CSCI 313 you'll build agents that search, plan and play like this.</p></div>`
      +ad()+`<p class="center dim">This run is locked. One run per person.</p>`;
  }

  function viewFog(st,id){
    const started=!!st;
    return header()+`
      <div class="card"><h2>Fog of war</h2>
        <div>${pixel("NODE "+id+" ??",4,"#a9a6c4")}</div>
        ${id===META.goalId?`<p class="yel">Nice try. That's the GOAL, but you have to <i>discover</i> it before you can expand it.</p>`:""}
        ${started?`<p>This node isn't in your open list yet, so it can't be expanded. Nothing changed, and this scan doesn't count.</p>`
          :`<p>Welcome, challenger. This flier is one of 100 nodes in an <b>A* pathfinding quest</b> hidden around Morken.</p>
            <p class="yel">To begin, find the START flier: ${esc(META.startLoc)} (Floor 1).</p>`}
      </div>`+(started?`<div class="card"><h2>Your open list</h2>${openTable(st)}</div>`:"")+rules(!started)+ad();
  }

  function viewIntro(){
    return header()+`<div class="card hot"><h2>Start node found</h2>
      <p>You've found <span class="yel">START</span>. From here you'll search a hidden graph of 100 fliers across all three floors of Morken. The goal is Dr. Caley's office.</p>
      <label class="dim">YOUR NAME (shown on your result screen)</label>
      <input id="nm" maxlength="24" placeholder="PLAYER 1" autocomplete="name">
      <button id="go">Press start <span class="blink">▶</span></button></div>`+rules(true)+ad();
  }

  function viewHome(st){
    if(st&&st.finished) return viewFinal(st);
    if(st){const last=st.exp[st.exp.length-1];return viewNode(st,last,false).replace("Already expanded","Your quest (last node)");}
    return header()+`<div class="card hot"><h2>Insert coin</h2>
      <p>100 fliers. One hidden graph. One shortest path to Dr. Caley's door.</p>
      <p class="yel">Begin at the START flier: ${esc(META.startLoc)} (Floor 1).</p></div>`+rules(true)+ad();
  }

  async function route(){
    const slug=(location.hash||"").replace(/^#\/?/,"").trim();
    let st=load(), out;
    if(!slug){$app.innerHTML=viewHome(st);hydrate();return;}
    try{ out=await handleScan(TABLE,st,slug); }
    catch(e){ console.error(e); $app.innerHTML=header()+`<div class="card"><h2>Glitch</h2><p class="warn">Couldn't read this node. Try scanning again.</p></div>`; return; }
    if(out.st&&out.fresh) save(out.st);
    const v=out.view;
    if(v==="unknown") $app.innerHTML=header()+`<div class="card"><h2>Unknown code</h2><p>That QR code isn't part of the quest.</p></div>`+rules(true)+ad();
    else if(v==="intro"){
      $app.innerHTML=viewIntro(); hydrate();
      document.getElementById("go").onclick=async()=>{
        const s=newState(document.getElementById("nm").value.trim().slice(0,24));
        const r=await handleScan(TABLE,s,slug); save(r.st);
        $app.innerHTML=viewNode(r.st,r.id,true); hydrate(); scrollTo(0,0);
      };
      return;
    }
    else if(v==="fog") $app.innerHTML=viewFog(out.st,out.id);
    else if(v==="final") $app.innerHTML=viewFinal(out.st);
    else $app.innerHTML=viewNode(out.st,out.id,!!out.fresh);
    if(!storageOK) $app.insertAdjacentHTML("afterbegin",`<div class="card"><p class="warn">This browser is blocking storage, so your progress can't be saved. Try your phone's normal browser and turn off private mode.</p></div>`);
    hydrate();
  }
  addEventListener("hashchange",route);
  route();
}
</script>
</body>
</html>
